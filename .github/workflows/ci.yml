name: CI

on:
  pull_request:
  push:
    branches:
      - feat/automation/**
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # For PR use head SHA; for push/manual fallback to current SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies (SeaTrack-v3)
        working-directory: SeaTrack-v3
        run: npm ci

      - name: Run shipment-rest tests
        working-directory: SeaTrack-v3
        run: |
          node scripts/test-shipment-rest.mjs
          node scripts/test-shipment-rest-request.mjs
