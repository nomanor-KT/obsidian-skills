name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies (SeaTrack-v3)
        run: npm ci --prefix SeaTrack-v3

      - name: Run repository tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "SeaTrack-v3/scripts/test-shipment-rest.mjs" ] && [ -f "SeaTrack-v3/scripts/test-shipment-rest-request.mjs" ]; then
            echo "Running shipment-rest tests"
            node SeaTrack-v3/scripts/test-shipment-rest.mjs
            node SeaTrack-v3/scripts/test-shipment-rest-request.mjs
          elif [ -f "SeaTrack-v3/scripts/test-tracking-status-rules.mjs" ]; then
            echo "Running tracking status rules test"
            node SeaTrack-v3/scripts/test-tracking-status-rules.mjs
          else
            echo "No supported CI test files found in SeaTrack-v3/scripts"
            exit 1
          fi
