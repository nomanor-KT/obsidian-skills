<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container Load Planner — M&amp;M Militzer &amp; Münch</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* === CUBE: COMPOSITION === */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body,#root{height:100%;width:100%;overflow:hidden}
    body{font-family:'JetBrains Mono',monospace;background:#0d1117;color:#e6edf3}
    .bento{display:grid;height:calc(100vh - 48px);gap:0;grid-template-columns:340px 1fr;grid-template-rows:1fr auto;grid-template-areas:"sidebar viewport" "sidebar analytics"}
    .bento-sidebar{grid-area:sidebar;overflow:hidden;display:flex;flex-direction:column;border-right:1px solid #30363d}
    .bento-viewport{grid-area:viewport;position:relative;overflow:hidden;min-height:180px}
    .bento-analytics{grid-area:analytics;border-top:1px solid #30363d;overflow-y:auto;max-height:45vh;min-height:60px}
    @media(max-width:1024px){.bento{grid-template-columns:1fr;grid-template-rows:45vh 1fr auto;grid-template-areas:"sidebar" "viewport" "analytics"}.bento-sidebar{border-right:none;border-bottom:1px solid #30363d}.grid-4,.grid-5{grid-template-columns:repeat(2,1fr)}}
    /* === CUBE: UTILITY === */
    .flex{display:flex}.flex-col{flex-direction:column}.flex-1{flex:1 1 0%}.flex-wrap{flex-wrap:wrap}
    .items-center{align-items:center}.justify-between{justify-content:space-between}.justify-center{justify-content:center}
    .gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
    .grid{display:grid}.grid-2{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(3,1fr)}.grid-4{grid-template-columns:repeat(4,1fr)}.grid-5{grid-template-columns:repeat(5,1fr)}
    .p-2{padding:8px}.p-3{padding:12px}.p-4{padding:16px}
    .px-3{padding-left:12px;padding-right:12px}.px-4{padding-left:16px;padding-right:16px}
    .py-1{padding-top:4px;padding-bottom:4px}.py-2{padding-top:8px;padding-bottom:8px}
    .mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}
    .w-full{width:100%}.h-full{height:100%}.rounded{border-radius:6px}.rounded-lg{border-radius:8px}
    .text-xs{font-size:11px;line-height:1.5}.text-sm{font-size:13px;line-height:1.5}.text-lg{font-size:18px}
    .font-medium{font-weight:500}.font-bold{font-weight:700}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .overflow-hidden{overflow:hidden}.overflow-y-auto{overflow-y:auto}
    .relative{position:relative}.absolute{position:absolute}
    .cursor-pointer{cursor:pointer}.pointer-events-none{pointer-events:none}
    .text-center{text-align:center}.tracking-tight{letter-spacing:-0.025em}
    .transition{transition:all .2s ease}.shadow-lg{box-shadow:0 10px 25px rgba(0,0,0,.3)}
    .space-y-1>*+*{margin-top:4px}.space-y-2>*+*{margin-top:8px}.space-y-3>*+*{margin-top:12px}.space-y-4>*+*{margin-top:16px}
    /* === CUBE: BLOCK === */
    ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:#161b22}::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
    .fade-in{animation:fadeIn .3s ease}
    @keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    input[type="number"]::-webkit-inner-spin-button{opacity:.3}
    select{cursor:pointer}
    .bg-dark{background:#0d1117}.bg-card{background:#161b22}.bg-card-inner{background:#0d1117}
    .border-dark{border-color:#30363d}
    .text-main{color:#e6edf3}.text-muted{color:#7d8590}.text-accent{color:#58a6ff}
    .text-green{color:#3fb950}.text-yellow{color:#d29922}.text-red{color:#f85149}.text-orange{color:#d18616}
    .app-header{background:#161b22;border-bottom:1px solid #30363d;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;flex-shrink:0}
    .input-field{background:#0d1117;border:1px solid #30363d;color:#e6edf3;padding:6px 8px;border-radius:6px;font-size:13px;font-family:inherit;width:100%;outline:none;transition:border-color .2s}
    .input-field:focus{border-color:#58a6ff}.input-field::placeholder{color:#484f58}
    .btn{padding:6px 12px;border-radius:6px;font-size:12px;font-family:inherit;cursor:pointer;border:none;transition:all .15s;font-weight:500}
    .btn:disabled{opacity:.5;cursor:not-allowed}.btn:focus-visible{outline:2px solid #58a6ff;outline-offset:2px}
    .btn-primary{background:#238636;color:#fff}.btn-primary:hover:not(:disabled){background:#2ea043}
    .btn-action{background:#1f6feb;color:#fff}.btn-action:hover:not(:disabled){background:#388bfd}
    .btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d}.btn-secondary:hover:not(:disabled){background:#30363d}
    .btn-danger{background:#da3633;color:#fff}.btn-danger:hover:not(:disabled){background:#f85149}
    .btn-auto{background:linear-gradient(135deg,#1f6feb,#238636);color:#fff;font-weight:600}.btn-auto:hover:not(:disabled){filter:brightness(1.15)}
    .tab{flex:1;padding:10px 0;text-align:center;font-size:11px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;color:#7d8590}
    .tab:hover{color:#c9d1d9}.tab[aria-selected="true"]{color:#58a6ff;border-bottom-color:#58a6ff}.tab:focus-visible{outline:2px solid #58a6ff;outline-offset:-2px}
    .tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500}
    .tag-green{background:rgba(63,185,80,.15);color:#3fb950}.tag-red{background:rgba(248,81,73,.15);color:#f85149}.tag-yellow{background:rgba(210,153,34,.15);color:#d29922}
    .alert-warn{background:rgba(187,128,9,.15);border:1px solid rgba(187,128,9,.3);color:#d29922;padding:8px;border-radius:6px;font-size:11px}
    .alert-danger{background:rgba(248,81,73,.15);border:1px solid rgba(248,81,73,.3);color:#f85149;padding:8px;border-radius:6px;font-size:11px}
    .alert-info{background:rgba(56,139,253,.1);border:1px solid rgba(56,139,253,.25);color:#58a6ff;padding:8px;border-radius:6px;font-size:11px}
    .bar-track{height:6px;border-radius:3px;background:#21262d;overflow:hidden}
    .bar-fill{height:100%;border-radius:3px;transition:width .5s ease}
    .bar-green{background:#238636}.bar-yellow{background:#d29922}.bar-red{background:#da3633}.bar-blue{background:#1f6feb}
    .gauge-card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px;transition:border-color .2s}
    .gauge-card:hover{border-color:#30363d}
    .gauge-ring{transform:rotate(-90deg)}.gauge-bg{fill:none;stroke:#21262d;stroke-width:4}.gauge-fg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
    .cargo-card{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:8px;font-size:11px;transition:border-color .2s}
    .cargo-card:focus-within{border-color:#58a6ff}.cargo-card[data-editing="true"]{border-color:#388bfd}
    .mc{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:12px;margin-top:8px;cursor:pointer;transition:border-color .2s}
    .mc:hover{border-color:#30363d}.mc[aria-selected="true"]{border-color:#388bfd;box-shadow:0 0 0 1px #388bfd}
    details summary{cursor:pointer;user-select:none}details summary:hover{color:#c9d1d9}
    /* === CUBE: EXCEPTION === */
    [data-busy="true"] .btn-action,[data-busy="true"] .btn-auto{pointer-events:none;opacity:.6}
  </style>

    // Orientation generator
    function getOrientations(cargo) {
      const {d,w,h,rotations,thisUp} = cargo;
      const set = new Set();
      const add = (a,b,c) => set.add(`${a},${b},${c}`);
      add(d,w,h);
      if (thisUp) {
        if (rotations.includes("h90")||rotations.includes("full")) add(w,d,h);
      } else {
        if (rotations.includes("full")) { add(d,h,w);add(w,d,h);add(w,h,d);add(h,d,w);add(h,w,d); }
        else { if(rotations.includes("h90"))add(w,d,h); if(rotations.includes("side"))add(d,h,w); if(rotations.includes("front"))add(h,w,d); }
      }
      return [...set].map(s=>s.split(",").map(Number));

    // 3D Bin Packing - CG-aware EP heuristic (cap, timeout, soft bounds)
    const MAX_EPS=150, PACK_TIMEOUT=6000, SOFT_MAX=15000;
    function packItems(container,cargoList,opts={}) {
      const maxW=opts.maxWeight||container.payload;
      const cD=container.d,cW=container.w,cH=container.h;
      const isFR=container.type==="flatrack",isOT=container.type==="opentop";
      const limD=cD, limW=isFR?SOFT_MAX:cW, limH=(isFR||isOT)?SOFT_MAX:cH;
      const t0=Date.now();
      const totalQty=cargoList.reduce((s,c)=>s+c.qty,0);
      const fastMode=totalQty>500;
      let items=[];
      cargoList.forEach(c=>{for(let i=0;i<c.qty;i++)items.push({...c,iid:uid(),oid:c.id})});
      items.sort((a,b)=>{const pa=a.priority||999,pb=b.priority||999;if(pa!==pb)return pb-pa;return(b.d*b.w*b.h)-(a.d*a.w*a.h)});
      let eps=[{x:0,y:0,z:0}],placed=[],notPlaced=[],curWeight=0;

      const midD=cD/2, midW=cW/2;

      // Simple geometric score for EP pruning/sorting
      const epSort=e=>e.z*10+e.x*2+e.y;

      // CG-aware placement score: predicts what CG would be after placing item here
      const placeSc=(ex,ey,ez,od,ow,iw)=>{
        // Base: pack from bottom up, back to front
        let score = ez*10 + ex*2;
        // Predict new CG center if we place item here

        if(sumWt+iw>0){
          const newCGx=(sumWx+cx*iw)/(sumWt+iw);
          const newCGy=(sumWy+cy*iw)/(sumWt+iw);
          // Deviation from container center (normalized 0..1)
          const axDev=Math.abs(newCGx-midD)/midD;
          const latDev=Math.abs(newCGy-midW)/midW;
          // Lateral balance is critical (tipping), axial less so
          score += latDev*8 + axDev*3;
        } else {
          // First item: prefer center-Y, back-X
          score += (Math.abs(cy-midW)/midW)*6;
        }
        return score;
      };

      const collides=(bx,by,bz,bd,bw,bh)=>{for(let i=placed.length-1;i>=0;i--){const e=placed[i];if(bx<e.x+e.pd&&bx+bd>e.x&&by<e.y+e.pw&&by+bw>e.y&&bz<e.z+e.ph&&bz+bh>e.z)return true}return false};
      const support=(bx,by,bz,bd,bw)=>{if(bz===0)return true;const area=bd*bw;let sup=0;for(let i=placed.length-1;i>=0;i--){const e=placed[i];if(Math.abs((e.z+e.ph)-bz)<1){const ox=Math.max(0,Math.min(bx+bd,e.x+e.pd)-Math.max(bx,e.x));const oy=Math.max(0,Math.min(by+bw,e.y+e.pw)-Math.max(by,e.y));sup+=ox*oy;if(sup>=area*0.7)return true}}return false};
      const canStack=(bx,by,bz,bd,bw,bwt)=>{if(bz===0)return true;for(const e of placed){if(Math.abs((e.z+e.ph)-bz)<1){const ox=Math.max(0,Math.min(bx+bd,e.x+e.pd)-Math.max(bx,e.x));const oy=Math.max(0,Math.min(by+bw,e.y+e.pw)-Math.max(by,e.y));if(ox>0&&oy>0){if(e.fragile||!e.stackable)return false;if(e.maxStackWeight>0&&bwt>e.maxStackWeight)return false}}}return true};

        if(found){const p={x:bestX,y:bestY,z:bestZ,pd:bestD,pw:bestW,ph:bestH,...item};placed.push(p);curWeight+=item.weight;sumWx+=(bestX+bestD/2)*item.weight;sumWy+=(bestY+bestW/2)*item.weight;sumWt+=item.weight;const nps=[{x:bestX+bestD,y:bestY,z:bestZ},{x:bestX,y:bestY+bestW,z:bestZ},{x:bestX,y:bestY,z:bestZ+bestH}];for(const np of nps){if(np.x<=limD&&np.y<=limW&&np.z<=limH&&!eps.some(e=>Math.abs(e.x-np.x)<1&&Math.abs(e.y-np.y)<1&&Math.abs(e.z-np.z)<1))eps.push(np)}eps=eps.filter(e=>!(Math.abs(e.x-bestX)<1&&Math.abs(e.y-bestY)<1&&Math.abs(e.z-bestZ)<1));eps.sort((a,b)=>epSort(a)-epSort(b));if(eps.length>MAX_EPS)eps.length=MAX_EPS}

    function calcCG(placed,cont) {
      if(!placed.length)return null;
      let tw=0,wx=0,wy=0,wz=0;
      for(const p of placed){wx+=(p.x+p.pd/2)*p.weight;wy+=(p.y+p.pw/2)*p.weight;wz+=(p.z+p.ph/2)*p.weight;tw+=p.weight}
      if(!tw)return null;
      const cgx=wx/tw,cgy=wy/tw,cgz=wz/tw;
      const axPct=(cgx/cont.d)*100;const latDev=Math.abs((cgy/cont.w)*100-50);
      const axOk=axPct>=40&&axPct<=60;const latOk=latDev<=5;
      return{x:cgx,y:cgy,z:cgz,axPct,latDev,axOk,latOk,status:axOk&&latOk?"ok":(!axOk&&!latOk?"danger":"warning"),tw};
    }

    // Calculate overhang for OT/FR containers
    function calcOverhang(placed,cont) {
      if(!placed.length)return null;
      let maxX=0,maxY=0,maxZ=0;
      for(const p of placed){
        maxX=Math.max(maxX,p.x+p.pd);
        maxY=Math.max(maxY,p.y+p.pw);
        maxZ=Math.max(maxZ,p.z+p.ph);
      }
      const overD=Math.max(0,maxX-cont.d);
      const overW=Math.max(0,maxY-cont.w);
      const overH=Math.max(0,maxZ-cont.h);
      const isFR=cont.type==="flatrack",isOT=cont.type==="opentop";
      if(!isFR&&!isOT)return null;
      if(overD===0&&overW===0&&overH===0)return null;
      return{overD:Math.round(overD/10),overW:Math.round(overW/10),overH:Math.round(overH/10),maxX,maxY,maxZ,isFR,isOT};
    }

    // AUTO-SUGGEST: greedy mixed-container optimization
    function autoSuggest(cargoList) {
      let maxD=0,maxW=0,maxH=0;
      cargoList.forEach(c=>{
        const orients=getOrientations(c);
        orients.forEach(o=>{maxD=Math.max(maxD,o[0]);maxW=Math.max(maxW,o[1]);maxH=Math.max(maxH,o[2])});
      });
      const eligible=CONTAINERS.filter(c=>c.type==="dry"&&c.volume&&c.d>=maxD&&c.w>=maxW&&c.h>=maxH);
      if(eligible.length===0)return{error:"Żaden standardowy kontener nie mieści największego ładunku. Sprawdź wymiary."};

      // Helper: regroup notPlaced items by original ID
      function regroup(notPlaced){
        const m={};
        notPlaced.forEach(p=>{if(!m[p.oid])m[p.oid]={...p,qty:0};m[p.oid].qty++});
        return Object.values(m);
      }
      // Helper: total qty from cargo list
      function totalQty(list){return list.reduce((s,c)=>s+c.qty,0)}
      // Helper: build container record
      function buildRec(cont,res){
        const cg=calcCG(res.placed,cont);
        const oh=calcOverhang(res.placed,cont);
        const usedVol=res.placed.reduce((s,p)=>s+p.pd*p.pw*p.ph,0)/1e9;
        return{container:cont,placed:res.placed,notPlaced:res.notPlaced,totalWeight:res.totalWeight,usedVol,volPct:cont.volume?(usedVol/cont.volume*100):0,wtPct:(res.totalWeight/cont.payload*100),cg,overhang:oh};
      }
      // Helper: make label from containers array  
      function makeLabel(containers){
        const counts={};
        containers.forEach(c=>{const n=c.container.name;counts[n]=(counts[n]||0)+1});
        return Object.entries(counts).map(([n,q])=>q+"× "+n).join(" + ");
      }
      // Helper: run one strategy and return result object
      function buildResult(containers,remaining){
        const allPlaced=totalQty(remaining)===0;
        const totalContainers=containers.length;
        const totalPayload=containers.reduce((s,c)=>s+c.container.payload,0);
        const totalVolume=containers.reduce((s,c)=>s+(c.container.volume||0),0);
        const label=makeLabel(containers);
        return{label,containers,totalContainers,allPlaced,remaining,totalPayload,totalVolume};
      }

      const results=[];
      const sortedByVol=[...eligible].sort((a,b)=>b.volume-a.volume);

      // STRATEGY 1: Greedy mixed — at each step pick the best container for remaining cargo
      {
        let remaining=cargoList.map(c=>({...c}));
        const containers=[];
        let safety=0;
        while(totalQty(remaining)>0 && safety<20){
          safety++;
          let bestRes=null,bestCont=null,bestPlaced=0,bestFitsAll=false,bestVol=Infinity;
          for(const cont of sortedByVol){
            const res=packItems(cont,remaining);
            if(res.placed.length===0)continue;
            const fitsAll=res.notPlaced.length===0;
            // Prefer: fits all in smallest container > most items placed
            if(fitsAll && !bestFitsAll){
              bestFitsAll=true;bestRes=res;bestCont=cont;bestPlaced=res.placed.length;bestVol=cont.volume;
            } else if(fitsAll && bestFitsAll && cont.volume<bestVol){
              bestRes=res;bestCont=cont;bestVol=cont.volume;
            } else if(!fitsAll && !bestFitsAll && res.placed.length>bestPlaced){
              bestRes=res;bestCont=cont;bestPlaced=res.placed.length;
            }
          }
          if(!bestRes)break;
          containers.push(buildRec(bestCont,bestRes));
          remaining=regroup(bestRes.notPlaced);
        }
        if(containers.length>0) results.push(buildResult(containers,remaining));
      }

      // STRATEGY 2: Same-type strategies (fill with one container type only)
      for(const cont of sortedByVol){
        let remaining=cargoList.map(c=>({...c}));
        const containers=[];
        let safety=0;
        while(totalQty(remaining)>0 && safety<20){
          safety++;
          const res=packItems(cont,remaining);
          if(res.placed.length===0)break;
          containers.push(buildRec(cont,res));
          remaining=regroup(res.notPlaced);
        }
        if(containers.length>0) results.push(buildResult(containers,remaining));
      }

      const seen=new Set();
      const unique=results.filter(r=>{if(seen.has(r.label))return false;seen.add(r.label);return true});

      // Sort: all placed first → fewest containers → best avg volume utilization
      unique.sort((a,b)=>{
        if(a.allPlaced!==b.allPlaced)return a.allPlaced?-1:1;
        if(a.totalContainers!==b.totalContainers)return a.totalContainers-b.totalContainers;
        const aV=a.containers.reduce((s,c)=>s+c.volPct,0)/a.totalContainers;
        const bV=b.containers.reduce((s,c)=>s+c.volPct,0)/b.totalContainers;
        return bV-aV;
      });
      return{results:unique};
    }

    function Gauge({value,max,label,unit,color,size=70}) {
      const pct=max>0?Math.min(100,(value/max)*100):0;
      const r=(size-8)/2;const C=2*Math.PI*r;const offset=C-(pct/100)*C;
      const sc=pct>90?"#da3633":pct>70?"#d29922":color||"#3fb950";
      return (
        <div className="gauge-card" role="meter" aria-valuenow={Math.round(pct)} aria-valuemin={0} aria-valuemax={100} aria-label={label+": "+Math.round(pct)+"%"}>
          <svg width={size} height={size} className="gauge-ring"><circle className="gauge-bg" cx={size/2} cy={size/2} r={r}/><circle className="gauge-fg" cx={size/2} cy={size/2} r={r} stroke={sc} strokeDasharray={C} strokeDashoffset={offset}/></svg>
          <div className="text-center" style={{marginTop:-4}}>
            <div style={{fontSize:14,fontWeight:700,color:sc}}>{pct.toFixed(1)}%</div>
            <div className="text-muted" style={{fontSize:9}}>{label}</div>
            <div className="text-muted" style={{fontSize:9}}>{typeof value==="number"?fmt(Math.round(value)):value} / {fmt(max)} {unit}</div>
          </div>
        </div>
      );
    }

    function App() {
      const [selCont,setSelCont] = useState("40hc");
      const [opWt,setOpWt] = useState("");
      const [cargo,setCargo] = useState([]);
      const [result,setResult] = useState(null); // single container result
      const [autoResult,setAutoResult] = useState(null); // auto-suggest multi results
      const [activeAutoIdx,setActiveAutoIdx] = useState(0); // which auto result to show
      const [activeContIdx,setActiveContIdx] = useState(0); // which container in the auto result to visualize
      const [hov,setHov] = useState(null);
      const [tab,setTab] = useState("container");
      const [busy,setBusy] = useState(false);
      const [showAdd,setShowAdd] = useState(false);
      const [editId,setEditId] = useState(null);
      const [refNum,setRefNum] = useState("");
      const [mode,setMode] = useState("manual"); // "manual" or "auto"
      const viewportRef = useRef(null);

      const cont = useMemo(()=>CONTAINERS.find(c=>c.id===selCont),[selCont]);
      const effWt = useMemo(()=>{const o=parseFloat(opWt);return(o>0&&o<cont.payload)?o:cont.payload},[opWt,cont]);
      const totWt = useMemo(()=>cargo.reduce((s,c)=>s+c.weight*c.qty,0),[cargo]);
      const totVol = useMemo(()=>cargo.reduce((s,c)=>s+(c.d*c.w*c.h*c.qty)/1e9,0),[cargo]);
      const totPcs = useMemo(()=>cargo.reduce((s,c)=>s+c.qty,0),[cargo]);

      const emptyC = {id:"",name:"",type:"paleta",d:1200,w:800,h:1000,weight:500,qty:1,stackable:true,maxStackWeight:1000,maxLayers:3,rotations:["h90"],fragile:false,thisUp:false,priority:"",color:COLORS[0]};
      const [nc,setNc] = useState({...emptyC});

      const addCargo = () => {
        if(!nc.name||nc.d<=0||nc.w<=0||nc.h<=0||nc.weight<=0||nc.qty<1)return;
        setCargo(p=>[...p,{...nc,id:uid()}]);
        setNc({...emptyC,color:COLORS[(cargo.length+1)%COLORS.length]});
        setShowAdd(false);
      };
      const saveCargo = () => {
        if(!nc.name||nc.d<=0||nc.w<=0||nc.h<=0||nc.weight<=0||nc.qty<1)return;
        setCargo(p=>p.map(c=>c.id===editId?{...nc,id:editId}:c));
        setNc({...emptyC,color:COLORS[(cargo.length)%COLORS.length]});
        setEditId(null);setShowAdd(false);
      };
      const startEdit = id => {
        const it=cargo.find(c=>c.id===id);
        if(it){setNc({...it});setEditId(id);setShowAdd(true)}
      };
      const cancelForm = () => {setShowAdd(false);setEditId(null);setNc({...emptyC,color:COLORS[cargo.length%COLORS.length]})};
      const delCargo = id => {setCargo(p=>p.filter(c=>c.id!==id));if(editId===id)cancelForm()};
      const dupCargo = id => {const it=cargo.find(c=>c.id===id);if(it)setCargo(p=>[...p,{...it,id:uid(),name:it.name+" (kopia)"}])};

      const typeChange = t => {
        const ct=CARGO_TYPES.find(x=>x.id===t);
        setNc(p=>({...p,type:t,stackable:ct.stackable,rotations:ct.rotH?["h90"]:["none"],thisUp:t==="beczka",d:ct.dD||p.d,w:ct.dW||p.w,h:ct.dH||p.h,maxStackWeight:ct.dMaxStack||1000}));
      };

      // Manual optimize for selected container
      const optimize = () => {
        setBusy(true);setMode("manual");setAutoResult(null);
        setTimeout(()=>{
          const r=packItems(cont,cargo,{maxWeight:effWt});
          const g=calcCG(r.placed,cont);
          const oh=calcOverhang(r.placed,cont);
          setResult({...r,cg:g,overhang:oh});setBusy(false);
        },50);
      };

      // Auto-suggest optimal containers
      const autoOptimize = () => {
        setBusy(true);setMode("auto");setResult(null);setActiveAutoIdx(0);setActiveContIdx(0);
        setTimeout(()=>{
          const r=autoSuggest(cargo);
          setAutoResult(r);setBusy(false);
        },100);
      };

      const exportJSON = () => {
        const d={container:selCont,cargo,opWt,refNum};
        const b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=`plan-${refNum||"export"}.json`;a.click();URL.revokeObjectURL(u);
      };
      const importJSON = e => {
        const f=e.target.files[0];if(!f)return;const r=new FileReader();
        r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.container)setSelCont(d.container);if(d.cargo)setCargo(d.cargo);if(d.opWt)setOpWt(d.opWt);if(d.refNum)setRefNum(d.refNum)}catch{alert("Błąd odczytu JSON")}};
        r.readAsText(f);
      };
      const exportCSV = () => {
        const h="Nazwa,Typ,Długość(mm),Szerokość(mm),Wysokość(mm),Waga(kg),Ilość,Piętrowalny,Rotacje\n";
        const rows=cargo.map(c=>`"${c.name}","${c.type}",${c.d},${c.w},${c.h},${c.weight},${c.qty},${c.stackable?"TAK":"NIE"},"${c.rotations.join(";")}"`).join("\n");
        const b=new Blob([h+rows],{type:"text/csv"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download="ladunki.csv";a.click();URL.revokeObjectURL(u);
      };
      const addTemplate = t => {
        setCargo(p=>[...p,{...emptyC,...t,id:uid(),stackable:t.type!=="beczka",rotations:t.type==="beczka"?["none"]:["h90"],thisUp:t.type==="beczka",color:COLORS[p.length%COLORS.length]}]);
      };

      const exportPDF = () => {
        const {jsPDF} = window.jspdf;
        const doc = new jsPDF({orientation:"landscape",unit:"mm",format:"a4"});
        const W=297,H=210,M=12;
        let y=M;
        const black=()=>doc.setTextColor(30,30,30);
        const dark=()=>doc.setTextColor(50,50,50);
        const gray=()=>doc.setTextColor(110,110,110);
        const blue=()=>doc.setTextColor(24,90,180);
        const green=()=>doc.setTextColor(20,130,50);
        const red=()=>doc.setTextColor(200,40,40);
        const orange=()=>doc.setTextColor(180,100,10);
        const now=new Date().toLocaleDateString("pl-PL")+" "+new Date().toLocaleTimeString("pl-PL",{hour:"2-digit",minute:"2-digit"});

        // Build list of containers to report
        let containersList = [];
        let variantLabel = "";
        let isMulti = false;
        if(mode==="auto"&&autoResult&&autoResult.results&&autoResult.results[activeAutoIdx]){
          const ar=autoResult.results[activeAutoIdx];
          containersList=ar.containers;
          variantLabel=ar.label+(ar.allPlaced?" — calosc zaladowana":"");
          isMulti=containersList.length>1;
        } else if(mode==="manual"&&result){
          containersList=[{container:cont,placed:result.placed,notPlaced:result.notPlaced,totalWeight:result.totalWeight,usedVol:result.placed.reduce((s,p)=>s+p.pd*p.pw*p.ph,0)/1e9,volPct:cont.volume?(result.placed.reduce((s,p)=>s+p.pd*p.pw*p.ph,0)/1e9/cont.volume*100):0,wtPct:(result.totalWeight/cont.payload*100),cg:result.cg,overhang:result.overhang}];
          variantLabel=cont.name;
        }
        if(containersList.length===0)return;

        // Helper: draw header band
        const drawHeader=(subtitle)=>{
          doc.setFillColor(24,55,110);doc.rect(0,0,W,16,"F");
          try{doc.addImage(LOGO_WHITE,"JPEG",M,2,26,11)}catch(e){}
          doc.setFont("helvetica","bold");doc.setFontSize(12);doc.setTextColor(255,255,255);
          doc.text("Container Load Planner",M+30,8);
          doc.setFontSize(7);doc.setTextColor(200,210,230);
          doc.text(subtitle,M+30,13);
          doc.setFontSize(8);doc.setTextColor(220,230,245);
          if(refNum)doc.text("Ref: "+refNum,W-M,7,{align:"right"});
          doc.text(now,W-M,12,{align:"right"});
        };

        // Helper: draw stat boxes for a container
        const drawStats=(cc)=>{
          const rW=cc.totalWeight?(cc.totalWeight/cc.container.payload*100):0;
          const rV=cc.usedVol&&cc.container.volume?(cc.usedVol/cc.container.volume*100):0;
          const bW=(W-2*M-9)/4;
          const drawBox=(x,label,value,pct,color)=>{
            doc.setFillColor(250,250,252);doc.setDrawColor(200,200,200);
            doc.roundedRect(x,y,bW,16,1.5,1.5,"FD");
            doc.setFontSize(6.5);gray();doc.text(label,x+3,y+5);
            doc.setFontSize(9);doc.setFont("helvetica","bold");
            if(color==="green")green();else if(color==="red")red();else if(color==="orange")orange();else black();
            doc.text(value,x+3,y+11);
            doc.setFont("helvetica","normal");
            if(pct!==null){
              doc.setFillColor(230,230,230);doc.rect(x+3,y+13,bW-6,1.5,"F");
              const barC=pct>90?[200,40,40]:pct>70?[200,150,30]:[30,140,60];
              doc.setFillColor(barC[0],barC[1],barC[2]);doc.rect(x+3,y+13,Math.min(100,pct)/100*(bW-6),1.5,"F");
            }
          };
          drawBox(M,"Waga",fmt(Math.round(cc.totalWeight||0))+" / "+fmt(cc.container.payload)+" kg  ("+rW.toFixed(1)+"%)",rW,rW>90?"red":rW>70?"orange":"green");
          drawBox(M+bW+3,"Objetosc",(cc.usedVol||0).toFixed(1)+" / "+(cc.container.volume||"—")+" m\u00B3  ("+rV.toFixed(1)+"%)",rV,"black");
          const cgL=cc.cg?(cc.cg.status==="ok"?"OK":cc.cg.status==="warning"?"Ostrzezenie":"Niebezpieczny"):"—";
          const cgC=cc.cg?(cc.cg.status==="ok"?"green":cc.cg.status==="warning"?"orange":"red"):"black";
          drawBox(M+2*(bW+3),"Srodek ciezkosci",cgL,null,cgC);
          if(cc.cg){doc.setFontSize(6);gray();doc.text("Os: "+cc.cg.axPct.toFixed(1)+"%  |  Lat: ±"+cc.cg.latDev.toFixed(1)+"%",M+2*(bW+3)+3,y+14.5)}
          drawBox(M+3*(bW+3),"Zaladowano",cc.placed.length+" szt.",null,"green");
          if(cc.overhang){
            let oh="";
            if(cc.overhang.overH>0)oh+="gora +"+cc.overhang.overH+"cm  ";
            if(cc.overhang.overW>0)oh+="boki +"+cc.overhang.overW+"cm";
            if(oh){doc.setFontSize(5.5);orange();doc.text("Wystawanie: "+oh,M+3*(bW+3)+3,y+14.5)}
          }
          y+=20;
        };

        // Helper: draw loading instructions table
        const drawLoadingTable=(placed)=>{
          if(!placed||!placed.length)return;
          if(y>H-40){doc.addPage();y=M}
          doc.setFillColor(24,55,110);doc.roundedRect(M,y,W-2*M,8,1.5,1.5,"F");
          doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);
          doc.text("Instrukcja zaladunku ("+placed.length+" krokow)",M+4,y+5.5);
          doc.setFont("helvetica","normal");y+=11;
          const ic=[M+2,M+14,M+72,M+120,M+148,M+195,M+235];
          const ih=["#","Nazwa","Orientacja (mm)","Waga (kg)","Pozycja X,Y,Z (mm)","Obrocony","Kolor"];
          doc.setFillColor(230,235,240);doc.rect(M,y,W-2*M,6,"F");
          doc.setFontSize(6.5);doc.setFont("helvetica","bold");dark();
          ih.forEach((h,i)=>doc.text(h,ic[i],y+4));
          doc.setFont("helvetica","normal");y+=7;
          doc.setFontSize(6);
          placed.forEach((p,i)=>{
            if(y>H-18){doc.addPage();y=M}
            if(i%2===0){doc.setFillColor(248,249,251);doc.rect(M,y-1,W-2*M,5.5,"F")}
            blue();doc.text(""+(i+1),ic[0],y+3);
            black();doc.text((p.name||"").substring(0,22),ic[1],y+3);
            dark();doc.text(p.pd+" x "+p.pw+" x "+p.ph,ic[2],y+3);
            doc.text(""+p.weight,ic[3],y+3);
            doc.text(Math.round(p.x)+",  "+Math.round(p.y)+",  "+Math.round(p.z),ic[4],y+3);
            (p.pd!==p.d||p.pw!==p.w)?orange():gray();
            doc.text(p.pd!==p.d||p.pw!==p.w?"TAK":"—",ic[5],y+3);
            const hex=p.color||"#388bfd";const cr=parseInt(hex.slice(1,3),16),cg2=parseInt(hex.slice(3,5),16),cb=parseInt(hex.slice(5,7),16);
            doc.setFillColor(cr,cg2,cb);doc.rect(ic[6],y-0.2,4,3.5,"F");
            y+=5.5;
          });
        };

        // ========== PAGE 1: Overview + cargo list ==========
        drawHeader("M&M Militzer & Münch — Raport zaladunku");
        y=22;

        // Overview box
        doc.setDrawColor(180,180,180);doc.setFillColor(245,247,250);
        const ovH=isMulti?28:16;
        doc.roundedRect(M,y,W-2*M,ovH,2,2,"FD");
        doc.setFontSize(10);doc.setFont("helvetica","bold");black();
        if(isMulti){
          doc.text("Wariant: "+variantLabel,M+4,y+6);
          doc.setFont("helvetica","normal");doc.setFontSize(7.5);dark();
          doc.text("Liczba kontenerow: "+containersList.length+"    |    Lacznie ladunkow: "+totPcs+" szt.    |    Laczna waga: "+fmt(totWt)+" kg    |    Laczna objetosc: "+totVol.toFixed(1)+" m\u00B3",M+4,y+13);
          // List containers
          doc.setFontSize(7);blue();
          let cListStr=containersList.map((cc,i)=>"#"+(i+1)+": "+cc.container.name).join("    |    ");
          doc.text(cListStr,M+4,y+20);
          doc.setFont("helvetica","normal");
        } else {
          doc.text("Kontener: "+containersList[0].container.name,M+4,y+6);
          doc.setFont("helvetica","normal");doc.setFontSize(7.5);dark();
          const c0=containersList[0].container;
          doc.text("Wymiary wewn.: "+fmt(c0.d)+" x "+fmt(c0.w)+" x "+fmt(c0.h)+" mm    |    Ladownosc: "+fmt(c0.payload)+" kg    |    Kubatura: "+(c0.volume||"—")+" m\u00B3",M+4,y+12);
        }
        y+=ovH+4;

        // Cargo table
        doc.setFillColor(24,55,110);doc.roundedRect(M,y,W-2*M,8,1.5,1.5,"F");
        doc.setFontSize(8);doc.setFont("helvetica","bold");doc.setTextColor(255,255,255);
        doc.text("Lista ladunkow ("+cargo.length+" typow, "+totPcs+" szt.)",M+4,y+5.5);
        doc.setFont("helvetica","normal");y+=11;
        const cols=[M+2,M+72,M+115,M+145,M+168,M+198,M+228];
        const colH2=["Nazwa","Wymiary (mm)","Waga (kg)","Ilosc","Typ","Pietrow.","Rotacje"];
        doc.setFillColor(230,235,240);doc.rect(M,y,W-2*M,6,"F");
        doc.setFontSize(6.5);doc.setFont("helvetica","bold");dark();
        colH2.forEach((h,i)=>doc.text(h,cols[i],y+4));
        doc.setFont("helvetica","normal");y+=7;
        doc.setFontSize(6.5);
        cargo.forEach((c,idx)=>{
          if(y>H-18){doc.addPage();y=M}
          if(idx%2===0){doc.setFillColor(248,249,251);doc.rect(M,y-1,W-2*M,6,"F")}
          black();doc.text((c.name||"").substring(0,28),cols[0],y+3);
          dark();doc.text(c.d+" x "+c.w+" x "+c.h,cols[1],y+3);
          doc.text(""+c.weight,cols[2],y+3);
          doc.text(""+c.qty,cols[3],y+3);
          gray();doc.text(c.type,cols[4],y+3);
          c.stackable?green():red();doc.text(c.stackable?"TAK":"NIE",cols[5],y+3);
          gray();doc.text((c.rotations||[]).join(", "),cols[6],y+3);
          y+=6;
        });

        // ========== CONTAINER PAGES ==========
        const vpEl=viewportRef.current;
        const threeRef=vpEl&&vpEl.children[0]&&vpEl.children[0]._three;

        // Helper: rebuild 3D scene for given container data, render on white bg, return imgData
        const captureContainer=(contData,placedData,cgData)=>{
          if(!threeRef)return null;
          const {scene,camera,renderer}=threeRef;
          const cvs=renderer.domElement;
          try{
            // Clear dynamic objects
            const dyn=scene.children.filter(c2=>c2.userData&&c2.userData.dyn);
            dyn.forEach(c2=>{scene.remove(c2);if(c2.geometry)c2.geometry.dispose();if(c2.material){if(Array.isArray(c2.material))c2.material.forEach(m2=>m2.dispose());else c2.material.dispose()}});
            // White bg, hide grid
            const origBg=scene.background?scene.background.clone():new THREE.Color(0x0d1117);
            scene.background=new THREE.Color(0xffffff);
            const grd=scene.children.find(c2=>c2.isGridHelper);
            if(grd)grd.visible=false;
            // Scale
            let mxD=contData.d,mxW=contData.w,mxH=contData.h;
            if(placedData&&placedData.length)placedData.forEach(p=>{mxD=Math.max(mxD,p.x+p.pd);mxW=Math.max(mxW,p.y+p.pw);mxH=Math.max(mxH,p.z+p.ph)});
            const S=2/Math.max(mxD,mxW,mxH);
            const isFR2=contData.type==="flatrack",isOT2=contData.type==="opentop";
            const wc=isFR2?0xf0883e:isOT2?0xd29922:0x388bfd;
            // Container wireframe
            const bg=new THREE.BoxGeometry(contData.d*S,contData.h*S,contData.w*S);
            const bl=new THREE.LineSegments(new THREE.EdgesGeometry(bg),new THREE.LineBasicMaterial({color:wc}));bl.position.set(contData.d*S/2,contData.h*S/2,contData.w*S/2);bl.userData.dyn=true;scene.add(bl);
            const bm=new THREE.Mesh(bg.clone(),new THREE.MeshPhongMaterial({color:wc,transparent:true,opacity:0.03,side:THREE.DoubleSide}));bm.position.copy(bl.position);bm.userData.dyn=true;scene.add(bm);
            // Floor
            const fm=new THREE.Mesh(new THREE.PlaneGeometry(contData.d*S,contData.w*S),new THREE.MeshPhongMaterial({color:0xdddddd,side:THREE.DoubleSide}));fm.rotation.x=-Math.PI/2;fm.position.set(contData.d*S/2,0.001,contData.w*S/2);fm.userData.dyn=true;scene.add(fm);
            // Door
            if(!isFR2){const dm=new THREE.Mesh(new THREE.PlaneGeometry(contData.w*S*0.92,contData.h*S*0.92),new THREE.MeshPhongMaterial({color:0xf0883e,transparent:true,opacity:0.12,side:THREE.DoubleSide}));dm.rotation.y=Math.PI/2;dm.position.set(contData.d*S+0.002,contData.h*S/2,contData.w*S/2);dm.userData.dyn=true;scene.add(dm)}
            // Cargo boxes
            if(placedData&&placedData.length)placedData.forEach((p,i)=>{const col=new THREE.Color(p.color||COLORS[i%COLORS.length]);const mesh=new THREE.Mesh(new THREE.BoxGeometry(p.pd*S,p.ph*S,p.pw*S),new THREE.MeshPhongMaterial({color:col,transparent:true,opacity:0.75}));mesh.position.set((p.x+p.pd/2)*S,(p.z+p.ph/2)*S,(p.y+p.pw/2)*S);mesh.userData.dyn=true;scene.add(mesh);const ln=new THREE.LineSegments(new THREE.EdgesGeometry(mesh.geometry),new THREE.LineBasicMaterial({color:0x000000}));ln.position.copy(mesh.position);ln.userData.dyn=true;scene.add(ln)});
            // CG marker
            if(cgData){const ccc=cgData.status==="ok"?0x3fb950:cgData.status==="warning"?0xd29922:0xf85149;const sm=new THREE.Mesh(new THREE.SphereGeometry(0.035,16,16),new THREE.MeshPhongMaterial({color:ccc,emissive:ccc,emissiveIntensity:0.6}));sm.position.set(cgData.x*S,cgData.z*S,cgData.y*S);sm.userData.dyn=true;scene.add(sm)}
            // Camera position
            const phi=Math.PI/4,theta=Math.PI/4,dist=2.8,tx=mxD*S/2,ty=mxH*S/2,tz=mxW*S/2;
            camera.position.set(tx+dist*Math.sin(phi)*Math.cos(theta),ty+dist*Math.cos(phi),tz+dist*Math.sin(phi)*Math.sin(theta));
            camera.lookAt(tx,ty,tz);
            renderer.render(scene,camera);
            const imgData=cvs.toDataURL("image/png");
            // Restore bg
            scene.background=origBg;
            if(grd)grd.visible=true;
            return imgData;
          }catch(e){return null}
        };

        containersList.forEach((cc,ci)=>{
          doc.addPage();y=M;
          const subTitle=isMulti?("Kontener "+(ci+1)+" / "+containersList.length+" — "+cc.container.name):cc.container.name;
          // Mini header
          doc.setFillColor(24,55,110);doc.rect(0,0,W,14,"F");
          try{doc.addImage(LOGO_WHITE,"JPEG",M,1.5,22,9)}catch(e){}
          doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(255,255,255);
          doc.text(subTitle,M+26,7);
          doc.setFontSize(7);doc.setTextColor(200,210,230);
          if(isMulti) doc.text("Wariant: "+variantLabel,M+26,12);
          doc.setFontSize(7);doc.setTextColor(220,230,245);
          if(refNum)doc.text("Ref: "+refNum,W-M,6,{align:"right"});
          doc.text(now,W-M,11,{align:"right"});
          y=19;
          // Container specs
          doc.setDrawColor(180,180,180);doc.setFillColor(245,247,250);
          doc.roundedRect(M,y,W-2*M,10,2,2,"FD");
          doc.setFontSize(7.5);dark();
          doc.text("Wymiary wewn.: "+fmt(cc.container.d)+" x "+fmt(cc.container.w)+" x "+fmt(cc.container.h)+" mm    |    Ladownosc: "+fmt(cc.container.payload)+" kg    |    Kubatura: "+(cc.container.volume||"—")+" m\u00B3    |    Typ: "+cc.container.type,M+4,y+6.5);
          y+=14;
          // Stats
          if(cc.placed.length>0) drawStats(cc);
          // 3D screenshot — rebuild scene for THIS container
          const imgData=captureContainer(cc.container,cc.placed,cc.cg);
          if(imgData&&threeRef){
            try{
              const cvs=threeRef.renderer.domElement;
              const maxImgH=H-y-M-4;
              if(maxImgH>30){
                const imgAspect=cvs.width/cvs.height;
                let finalW=W-2*M,finalH=finalW/imgAspect;
                if(finalH>maxImgH){finalH=maxImgH;finalW=finalH*imgAspect}
                doc.setDrawColor(200,200,200);
                doc.roundedRect(M+(W-2*M-finalW)/2-0.5,y-0.5,finalW+1,finalH+1,1,1,"D");
                doc.addImage(imgData,"PNG",M+(W-2*M-finalW)/2,y,finalW,finalH);
                y+=finalH+4;
              }
            }catch(e){}
          }
          // Loading instructions
          drawLoadingTable(cc.placed);
        });
        // Restore original view — rebuild scene for active container with dark bg
        if(threeRef){
          const ac=containersList[activeContIdx]||containersList[0];
          if(ac){
            captureContainer(ac.container,ac.placed,ac.cg);
            // Restore dark background & grid
            threeRef.scene.background=new THREE.Color(0x0d1117);
            const grd2=threeRef.scene.children.find(c2=>c2.isGridHelper);
            if(grd2)grd2.visible=true;
            // Floor color back to dark
            threeRef.scene.children.filter(c2=>c2.userData&&c2.userData.dyn&&c2.isMesh&&c2.geometry.type==="PlaneGeometry"&&c2.rotation.x!=0).forEach(c2=>{if(c2.material)c2.material.color.set(0x161b22)});
            threeRef.renderer.render(threeRef.scene,threeRef.camera);
          }
        }

        // Footers on all pages
        const np=doc.internal.getNumberOfPages();
        for(let pg=1;pg<=np;pg++){
          doc.setPage(pg);
          doc.setDrawColor(200,200,200);doc.line(M,H-8,W-M,H-8);
          doc.setFontSize(5.5);gray();
          doc.text("Wygenerowano: "+now+"   |   M&M Militzer & Münch — Container Load Planner",M,H-4.5);
          doc.text("Strona "+pg+"/"+np,W-M,H-4.5,{align:"right"});
        }

        doc.save("zaladun"+"ek-"+(refNum||"plan")+".pdf");
      };

      // Current visualization data
      let viewCont, viewPlaced, viewCG, viewWt, viewVolUsed, viewOverhang;
      if (mode === "auto" && autoResult && autoResult.results && autoResult.results.length > 0) {
        const ar = autoResult.results[activeAutoIdx];
        if (ar && ar.containers[activeContIdx]) {
          const ac = ar.containers[activeContIdx];
          viewCont = ac.container;
          viewPlaced = ac.placed;
          viewCG = ac.cg;
          viewWt = ac.totalWeight;
          viewVolUsed = ac.usedVol;
          viewOverhang = ac.overhang;
        }
      } else if (mode === "manual" && result) {
        viewCont = cont;
        viewPlaced = result.placed;
        viewCG = result.cg;
        viewWt = result.totalWeight;
        viewVolUsed = result.placed.reduce((s,p)=>s+p.pd*p.pw*p.ph,0)/1e9;
        viewOverhang = result.overhang;
      }
      if (!viewCont) viewCont = cont;
      if (!viewPlaced) viewPlaced = [];

      const hovItem = viewPlaced.find(p=>p.iid===hov);
      const rWPct = viewWt ? (viewWt/viewCont.payload*100) : 0;
      const rVPct = viewVolUsed && viewCont.volume ? (viewVolUsed/viewCont.volume*100) : 0;

      return (
        <div className="bg-dark text-main" data-busy={busy} data-mode={mode} style={{height:"100vh",display:"flex",flexDirection:"column",fontFamily:"'JetBrains Mono',monospace"}}>

          {/* ===== HEADER ===== */}
          <header className="app-header" role="banner">
            <div className="flex items-center gap-3">
              <img src={LOGO_WHITE} alt="M&M Militzer & Münch" style={{height:32,objectFit:"contain"}} />
              <div style={{width:1,height:24,background:"#30363d"}} />
              <div>
                <h1 className="font-bold tracking-tight" style={{fontSize:14,fontFamily:"'Space Grotesk',sans-serif",margin:0,lineHeight:1.2}}>Container Load Planner</h1>
                <p className="text-muted" style={{fontSize:9,margin:0}}>Kalkulator załadunku kontenerów morskich</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <input className="input-field" style={{width:130,fontSize:10}} placeholder="Nr referencyjny..." value={refNum} onChange={e=>setRefNum(e.target.value)} aria-label="Numer referencyjny" />
            </div>
          </header>

          {/* ===== BENTO GRID ===== */}
          <div className="bento">

            {/* ===== SIDEBAR ===== */}
            <aside className="bento-sidebar bg-card" role="navigation" aria-label="Konfiguracja">
              <div className="flex" role="tablist" aria-label="Zakładki" style={{borderBottom:"1px solid #30363d"}}>
                {[["container","📦 Kontener"],["cargo","🏗️ Ładunki"],["settings","⚙️ Akcje"]].map(([k,l])=>(
                  <div key={k} className="tab" role="tab" aria-selected={tab===k} tabIndex={tab===k?0:-1} onClick={()=>setTab(k)} onKeyDown={e=>{if(e.key==="Enter"||e.key===" ")setTab(k)}}>{l}</div>
                ))}
              </div>

              <div className="flex-1 overflow-y-auto p-3" role="tabpanel">
                {/* CONTAINER TAB */}
                {tab==="container" && (
                  <div className="space-y-3 fade-in">
                    <div>
                      <label className="text-xs font-medium block mb-1" htmlFor="sel-cont">Typ kontenera</label>
                      <select id="sel-cont" className="input-field" value={selCont} onChange={e=>{setSelCont(e.target.value);setResult(null);setAutoResult(null)}}>
                        {CONTAINERS.map(c=><option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                    <div className="bg-card-inner rounded p-3 text-xs space-y-2">
                      <div className="flex justify-between"><span className="text-muted">Wymiary wewn.:</span><span className="font-medium">{fmtDim(cont.d,cont.w,cont.h)} mm</span></div>
                      <div className="flex justify-between"><span className="text-muted">Ładowność:</span><span className="font-medium">{fmt(cont.payload)} kg</span></div>
                      {cont.volume&&<div className="flex justify-between"><span className="text-muted">Kubatura:</span><span className="font-medium">{cont.volume} m³</span></div>}
                      {cont.type==="reefer"&&<div className="alert-warn mt-2">⚠️ Reefer — wymiary mniejsze ze wzgl. na agregat.</div>}
                      {cont.type==="opentop"&&<div className="alert-info mt-2">ℹ️ Open Top — ładunek może wystawać ponad dach.</div>}
                      {cont.type==="flatrack"&&<div className="alert-warn mt-2">⚠️ Flat Rack — brak ścian bocznych.</div>}
                      <svg viewBox="0 0 260 90" style={{width:"100%",marginTop:8}} aria-hidden="true">
                        <rect x="20" y="8" width="195" height="62" fill="none" stroke="#388bfd" strokeWidth="1.2" strokeDasharray="4 2" rx="2"/>
                        <text x="117" y="43" textAnchor="middle" fill="#7d8590" fontSize="7" fontFamily="inherit">{fmt(cont.d)} mm</text>
                        <text x="228" y="42" fill="#7d8590" fontSize="6.5" fontFamily="inherit">{fmt(cont.h)}</text>
                        <text x="117" y="82" textAnchor="middle" fill="#7d8590" fontSize="6.5" fontFamily="inherit">{fmt(cont.w)} mm szer.</text>
                        <line x1="215" y1="8" x2="215" y2="70" stroke="#f0883e" strokeWidth="2"/>
                        <text x="225" y="75" fill="#f0883e" fontSize="5.5" fontFamily="inherit">DRZWI</text>
                      </svg>
                    </div>
                    <div>
                      <label className="text-xs font-medium block mb-1" htmlFor="op-wt">Limit wagowy operatora (kg) <span className="text-muted" style={{fontWeight:400}}>— opcjonalnie</span></label>
                      <input id="op-wt" className="input-field" type="number" placeholder={`Max: ${fmt(cont.payload)} kg`} value={opWt} onChange={e=>setOpWt(e.target.value)}/>
                      <p className="text-muted mt-1" style={{fontSize:10}}>Obowiązujący limit: <strong className="text-main">{fmt(effWt)} kg</strong></p>
                    </div>
                    <div className="alert-warn" style={{fontSize:10}}>⚖️ <strong>VGM (SOLAS)</strong>: Pamiętaj o weryfikacji masy brutto kontenera.</div>
                  </div>
                )}

                {/* CARGO TAB */}
                {tab==="cargo" && (
                  <div className="space-y-2 fade-in">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-xs text-muted">{cargo.length} typ(ów) · {totPcs} szt.</span>
                      <div className="flex gap-1">
                        <button className="btn btn-secondary" style={{fontSize:10}} onClick={exportCSV} aria-label="Eksportuj CSV">📤 CSV</button>
                        <button className="btn btn-primary" style={{fontSize:11}} onClick={()=>{setEditId(null);setNc({...emptyC,color:COLORS[cargo.length%COLORS.length]});setShowAdd(true)}} aria-label="Dodaj ładunek">+ Dodaj</button>
                      </div>
                    </div>

                    {cargo.map(c=>(
                      <div key={c.id} className="cargo-card fade-in" data-editing={editId===c.id} tabIndex={0} aria-label={`${c.name}, ${c.qty} szt.`}>
                        <div className="flex items-center gap-2 mb-1">
                          <div style={{width:10,height:10,borderRadius:2,background:c.color,flexShrink:0}} aria-hidden="true"/>
                          <span className="font-medium flex-1 truncate">{c.name}</span>
                          <span className="text-muted">×{c.qty}</span>
                        </div>
                        <div className="text-muted" style={{fontSize:10}}>{fmtDim(c.d,c.w,c.h)} mm · {fmt(c.weight)} kg/szt.</div>
                        <div className="flex gap-2 mt-1" style={{fontSize:10}}>
                          {c.stackable&&<span className="tag tag-green">Piętrowalny</span>}
                          {c.fragile&&<span className="tag tag-red">Kruchy</span>}
                          {c.thisUp&&<span className="tag tag-yellow">This Side Up</span>}
                        </div>
                        <div className="flex gap-1 mt-2">
                          <button className="btn btn-action" style={{fontSize:10,padding:"2px 8px"}} onClick={()=>startEdit(c.id)} aria-label={`Edytuj ${c.name}`}>✏️ Edytuj</button>
                          <button className="btn btn-secondary" style={{fontSize:10,padding:"2px 8px"}} onClick={()=>dupCargo(c.id)}>Duplikuj</button>
                          <button className="btn btn-danger" style={{fontSize:10,padding:"2px 8px"}} onClick={()=>delCargo(c.id)}>Usuń</button>
                        </div>
                      </div>
                    ))}

                    {cargo.length===0&&!showAdd&&<div className="text-center text-muted" style={{padding:"40px 0",fontSize:11}} role="status">Brak ładunków.<br/>Kliknij „+ Dodaj" aby rozpocząć.</div>}

                    {showAdd && (
                      <div className="bg-card rounded-lg p-3 space-y-2 fade-in" style={{border:editId?"1px solid #388bfd":"1px solid #30363d"}} role="form" aria-label={editId?"Edycja ładunku":"Nowy ładunek"}>
                        <div className="flex justify-between items-center"><span className="text-sm font-medium">{editId?"✏️ Edycja ładunku":"Nowy ładunek"}</span><button className="text-muted cursor-pointer btn btn-secondary" style={{fontSize:14,padding:"0 6px",border:"none"}} onClick={cancelForm} aria-label="Zamknij">✕</button></div>
                        <input className="input-field" placeholder="Nazwa ładunku *" value={nc.name} onChange={e=>setNc(p=>({...p,name:e.target.value}))} aria-label="Nazwa ładunku" aria-required="true"/>
                        <select className="input-field" value={nc.type} onChange={e=>typeChange(e.target.value)} aria-label="Typ ładunku">{CARGO_TYPES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select>
                        <div className="grid grid-3 gap-2">
                          {[["d","Dł."],["w","Szer."],["h","Wys."]].map(([k,l])=>(<div key={k}><label className="text-muted" style={{fontSize:10}}>{l} (mm)</label><input className="input-field" type="number" value={nc[k]} onChange={e=>setNc(p=>({...p,[k]:+e.target.value}))} aria-label={l+" mm"}/></div>))}
                        </div>
                        <div className="grid grid-2 gap-2">
                          <div><label className="text-muted" style={{fontSize:10}}>Waga szt. (kg)</label><input className="input-field" type="number" value={nc.weight} onChange={e=>setNc(p=>({...p,weight:+e.target.value}))} aria-label="Waga"/></div>
                          <div><label className="text-muted" style={{fontSize:10}}>Ilość</label><input className="input-field" type="number" min="1" value={nc.qty} onChange={e=>setNc(p=>({...p,qty:Math.max(1,+e.target.value)}))} aria-label="Ilość"/></div>
                        </div>
                        <div><label className="text-muted block mb-1" style={{fontSize:10}}>Dozwolone rotacje</label>{ROTATION_OPTS.map(r=>(<label key={r.id} className="flex items-center gap-2 cursor-pointer" style={{fontSize:11,marginBottom:2}}><input type="checkbox" checked={nc.rotations.includes(r.id)} onChange={e=>{setNc(p=>({...p,rotations:e.target.checked?[...p.rotations.filter(x=>x!=="none"),r.id]:p.rotations.filter(x=>x!==r.id)}))}}/>{r.label}</label>))}</div>
                        <div className="flex gap-4" style={{fontSize:11}}>
                          <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={nc.stackable} onChange={e=>setNc(p=>({...p,stackable:e.target.checked}))}/> Piętrowalny</label>
                          <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={nc.fragile} onChange={e=>setNc(p=>({...p,fragile:e.target.checked}))}/> Kruchy</label>
                          <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" checked={nc.thisUp} onChange={e=>setNc(p=>({...p,thisUp:e.target.checked}))}/> This Side Up</label>
                        </div>
                        {nc.stackable&&(<div className="grid grid-2 gap-2"><div><label className="text-muted" style={{fontSize:10}}>Max obciążenie (kg)</label><input className="input-field" type="number" value={nc.maxStackWeight} onChange={e=>setNc(p=>({...p,maxStackWeight:+e.target.value}))}/></div><div><label className="text-muted" style={{fontSize:10}}>Max warstw</label><input className="input-field" type="number" min="1" value={nc.maxLayers} onChange={e=>setNc(p=>({...p,maxLayers:Math.max(1,+e.target.value)}))}/></div></div>)}
                        <div className="grid grid-2 gap-2"><div><label className="text-muted" style={{fontSize:10}}>Kolor</label><input type="color" style={{width:"100%",height:30,borderRadius:4,cursor:"pointer",border:"none"}} value={nc.color} onChange={e=>setNc(p=>({...p,color:e.target.value}))}/></div><div><label className="text-muted" style={{fontSize:10}}>Priorytet rozładunku</label><input className="input-field" type="number" min="1" placeholder="1 = pierwszy" value={nc.priority} onChange={e=>setNc(p=>({...p,priority:e.target.value?+e.target.value:""}))}/></div></div>
                        {nc.type==="beczka"&&<div className="alert-warn" style={{fontSize:10}}>🛢️ Beczka na boku wymaga zabezpieczenia przed toczeniem.</div>}
                        <div className="flex gap-2">{editId?(<button className="btn btn-action w-full" style={{padding:"8px 0",fontSize:13}} onClick={saveCargo}>💾 Zapisz zmiany</button>):(<button className="btn btn-primary w-full" style={{padding:"8px 0",fontSize:13}} onClick={addCargo}>Dodaj ładunek</button>)}</div>
                      </div>
                    )}
                  </div>
                )}

                {/* SETTINGS TAB */}
                {tab==="settings" && (
                  <div className="space-y-4 fade-in">
                    <div><label className="text-xs font-medium block mb-2">Import / Eksport</label>
                      <div className="space-y-2">
                        <button className="btn btn-secondary w-full" onClick={exportJSON}>💾 Eksportuj konfigurację (JSON)</button>
                        <label className="btn btn-secondary w-full block text-center cursor-pointer" style={{position:"relative"}}>📂 Importuj konfigurację (JSON)<input type="file" accept=".json" style={{position:"absolute",opacity:0,width:"100%",height:"100%",top:0,left:0,cursor:"pointer"}} onChange={importJSON}/></label>
                        <button className="btn btn-secondary w-full" onClick={exportCSV}>📤 Eksportuj ładunki (CSV)</button>
                        <button className="btn btn-secondary w-full" disabled={viewPlaced.length===0} onClick={exportPDF}>📄 Generuj raport PDF</button>
                        <button className="btn btn-danger w-full" onClick={()=>{setCargo([]);setResult(null);setAutoResult(null)}}>🗑️ Resetuj wszystko</button>
                      </div>
                    </div>
                    <div><label className="text-xs font-medium block mb-2">Szablony szybkiego dodawania</label>
                      <div className="space-y-1">
                        {[{name:"Paleta EUR z towarem",d:1200,w:800,h:1500,weight:750,type:"paleta",qty:20},{name:"Paleta EUR niska",d:1200,w:800,h:1000,weight:500,type:"paleta",qty:30},{name:"Karton standardowy",d:600,w:400,h:400,weight:25,type:"karton",qty:100},{name:"Beczka 200L",d:600,w:600,h:900,weight:200,type:"beczka",qty:10},{name:"Skrzynia maszynowa",d:2000,w:1200,h:1500,weight:2000,type:"skrzynia",qty:3}].map((t,i)=>(
                          <button key={i} className="btn btn-secondary w-full text-left" style={{fontSize:10,padding:"6px 8px"}} onClick={()=>addTemplate(t)}>+ {t.name} ({t.qty} szt.)</button>
                        ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </aside>

            {/* ===== 3D VIEWPORT ===== */}
            <main ref={viewportRef} className="bento-viewport" aria-label="Wizualizacja 3D">
              <Viewer3D container={viewCont} placed={viewPlaced} cg={viewCG} hoveredId={hov} onHover={setHov}/>

              {hovItem&&(<div className="absolute pointer-events-none fade-in" style={{top:12,left:12,background:"rgba(0,0,0,0.85)",backdropFilter:"blur(8px)",borderRadius:8,padding:10,fontSize:11,color:"#e6edf3",border:"1px solid rgba(255,255,255,0.08)",maxWidth:260}} role="tooltip"><div className="font-medium" style={{marginBottom:4}}>{hovItem.name}</div><div className="text-muted" style={{fontSize:10,lineHeight:1.6}}>Orientacja: {hovItem.pd} × {hovItem.pw} × {hovItem.ph} mm<br/>Waga: {fmt(hovItem.weight)} kg<br/>Pozycja: ({fmt(Math.round(hovItem.x))}, {fmt(Math.round(hovItem.y))}, {fmt(Math.round(hovItem.z))}) mm</div></div>)}

              <div className="absolute" style={{bottom:12,right:12,display:"flex",gap:8,flexWrap:"wrap",justifyContent:"flex-end"}}>
                <button className="btn btn-action shadow-lg" style={{padding:"10px 16px",fontSize:13,fontWeight:600}} disabled={cargo.length===0||busy} onClick={optimize} aria-label="Załaduj do wybranego">
                  {busy&&mode==="manual"?"⏳ Optymalizuję...":"📦 Załaduj do wybranego"}
                </button>
                <button className="btn btn-auto shadow-lg" style={{padding:"10px 16px",fontSize:13}} disabled={cargo.length===0||busy} onClick={autoOptimize} aria-label="Auto-dobór kontenerów">
                  {busy&&mode==="auto"?"⏳ Analizuję...":"🤖 Dobierz kontenery automatycznie"}
                </button>
              </div>

              <div className="absolute" style={{top:12,right:12,background:"rgba(0,0,0,0.6)",backdropFilter:"blur(6px)",borderRadius:8,padding:8,fontSize:10,color:"rgba(230,237,243,0.8)",lineHeight:1.7}} aria-live="polite">
                <div>📦 {viewCont.name}</div>
                <div>Ładunki: {totPcs} szt. ({cargo.length} typów)</div>
                {mode==="auto"&&autoResult&&autoResult.results&&<div className="text-accent" style={{fontWeight:600}}>🤖 Tryb automatyczny</div>}
              </div>
              <div className="absolute text-muted" style={{bottom:12,left:12,fontSize:9,opacity:0.5}} aria-hidden="true">LPM: obracanie · Scroll: zoom · PPM: przesuwanie</div>
            </main>

            {/* ===== ANALYTICS PANEL ===== */}
            <section className="bento-analytics bg-card p-3" aria-label="Statystyki załadunku">

              {/* Auto results */}
              {mode==="auto"&&autoResult&&(
                <div className="fade-in" style={{marginBottom:12}} role="region" aria-label="Wyniki auto-doboru">
                  {autoResult.error?(<div className="alert-danger" role="alert">{autoResult.error}</div>):(
                    <div>
                      <div className="text-xs font-medium mb-2" style={{fontFamily:"'Space Grotesk',sans-serif"}}>🤖 Wyniki automatycznego doboru kontenerów</div>
                      <div className="space-y-2" role="listbox" aria-label="Warianty">
                        {autoResult.results.slice(0,5).map((r,i)=>{
                          const avgVol=r.containers.reduce((s,c)=>s+c.volPct,0)/r.totalContainers;
                          const isActive=i===activeAutoIdx;
                          return (
                            <div key={i} className="mc" role="option" aria-selected={isActive} onClick={()=>{setActiveAutoIdx(i);setActiveContIdx(0)}} tabIndex={0} onKeyDown={e=>{if(e.key==="Enter"){setActiveAutoIdx(i);setActiveContIdx(0)}}}>
                              <div className="flex justify-between items-center">
                                <div><span className="text-sm font-medium">{r.label}</span>{i===0&&<span className="tag tag-green" style={{marginLeft:8}}>Zalecane</span>}</div>
                                <span className={`text-xs font-medium ${r.allPlaced?"text-green":"text-red"}`}>{r.allPlaced?"✅ Wszystko mieści się":"❌ Nie mieści się"}</span>
                              </div>
                              <div className="text-muted text-xs" style={{marginTop:4}}>Śr. wypełnienie: {avgVol.toFixed(1)}% obj. · Łączna ładowność: {fmt(r.totalPayload)} kg</div>
                              {isActive&&r.containers.length>1&&(
                                <div className="flex gap-1 mt-2 flex-wrap" role="tablist">
                                  {r.containers.map((cc,ci)=>(
                                    <button key={ci} className={`btn ${ci===activeContIdx?"btn-action":"btn-secondary"}`} role="tab" aria-selected={ci===activeContIdx} style={{fontSize:10,padding:"3px 10px"}} onClick={e=>{e.stopPropagation();setActiveContIdx(ci)}}>{ci+1}: {cc.container.name.split(" ")[0]}</button>
                                  ))}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* ===== BENTO GAUGE CARDS ===== */}
              <div className="grid grid-5 gap-3" role="region" aria-label="Wskaźniki">
                <Gauge value={viewWt||0} max={viewCont.payload} label="Waga" unit="kg" color="#238636" />
                <Gauge value={viewVolUsed||0} max={viewCont.volume||0} label="Objętość" unit="m³" color="#1f6feb" />
                <CGCard cg={viewCG} />
                <LoadedCard count={viewPlaced.length} />
                <OOGCard overhang={viewOverhang} />
              </div>

              {/* Loading steps + PDF */}
              {viewPlaced.length>0&&(
                <div style={{marginTop:10}}>
                  <div className="flex justify-between items-center">
                    <details style={{flex:1}}><summary className="text-muted text-xs">📋 Instrukcja załadunku ({viewPlaced.length} kroków)</summary>
                      <div className="bg-card-inner rounded p-2 mt-2" style={{maxHeight:160,overflowY:"auto",fontSize:10}} role="table">
                        {viewPlaced.map((p,i)=>(<div key={i} className="flex gap-2" style={{padding:"4px 0",borderTop:i>0?"1px solid #21262d":"none"}}><span className="text-accent font-medium" style={{width:28,flexShrink:0}}>#{i+1}</span><div><span className="font-medium">{p.name}</span><span className="text-muted"> — {p.pd}×{p.pw}×{p.ph}mm, {p.weight}kg</span><div className="text-muted">Poz: ({Math.round(p.x)}, {Math.round(p.y)}, {Math.round(p.z)}) mm{p.pd!==p.d||p.pw!==p.w?" · obrócony":""}</div></div></div>))}
                      </div>
                    </details>
                    <button className="btn btn-secondary" style={{fontSize:10,padding:"3px 10px",marginLeft:8,flexShrink:0}} onClick={exportPDF} aria-label="Generuj PDF">📄 PDF</button>
                  </div>
                </div>
              )}

              {viewCG&&viewCG.status!=="ok"&&(
                <div className={viewCG.status==="warning"?"alert-warn":"alert-danger"} style={{marginTop:8,fontSize:10}} role="alert">
                  {viewCG.status==="danger"?"🚨":"⚠️"} <strong>Środek ciężkości poza optymalnym zakresem.</strong>{" "}
                  {!viewCG.axOk&&`Osiowo: ${viewCG.axPct.toFixed(1)}% (norma: 40-60%). `}
                  {!viewCG.latOk&&`Poprzecznie: ±${viewCG.latDev.toFixed(1)}% (max 5%). `}
                </div>
              )}

              {viewOverhang&&(
                <div className="alert-warn" style={{marginTop:8,fontSize:10}} role="alert">
                  📐 <strong>Ładunek wystaje poza wymiary kontenera{viewOverhang.isFR?" (Flat Rack)":" (Open Top)"}:</strong>
                  <div style={{marginTop:4,lineHeight:1.8}}>
                    {viewOverhang.overH>0&&<span style={{display:"inline-block",marginRight:12}}>↑ Góra: <strong className="text-yellow">+{viewOverhang.overH} cm</strong></span>}
                    {viewOverhang.overW>0&&<span style={{display:"inline-block",marginRight:12}}>↔ Boki: <strong className="text-yellow">+{viewOverhang.overW} cm</strong></span>}
                  </div>
                  <div className="text-muted" style={{marginTop:2}}>
                    Wymiary ładunku: {Math.round(viewOverhang.maxX/10)} × {Math.round(viewOverhang.maxY/10)} × {Math.round(viewOverhang.maxZ/10)} cm
                    {" "}(kontener: {Math.round(viewCont.d/10)} × {Math.round(viewCont.w/10)} × {Math.round(viewCont.h/10)} cm)
                  </div>
                  {viewOverhang.isFR&&<div className="text-muted" style={{marginTop:2}}>⚠️ Wymagane zabezpieczenie boczne i oznakowanie OOG.</div>}
                  {viewOverhang.isOT&&viewOverhang.overH>0&&<div className="text-muted" style={{marginTop:2}}>⚠️ Wymagana plandeka lub oznakowanie ładunku wystającego.</div>}
                </div>
              )}
            </section>
          </div>
        </div>
      );

    }

    ReactDOM.render(<App/>,document.getElementById("root"));
  </script>
</body>
</html>
