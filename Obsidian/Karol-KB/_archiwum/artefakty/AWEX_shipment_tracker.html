<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWEX Shipment Tracker — M&M</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f2f5;--bg-card:#fff;--bg-input:#f7f8fa;--navy:#004785;--navy-soft:rgba(0,71,133,.06);--accent:#e6a817;--accent-soft:rgba(230,168,23,.08);--green:#0d9e6c;--green-soft:rgba(13,158,108,.08);--red:#d93025;--red-soft:rgba(217,48,37,.06);--blue:#2563eb;--blue-soft:rgba(37,99,235,.06);--border:#dce0e6;--border-light:#e8ecf0;--text:#1a2233;--text-muted:#5a6678;--text-dim:#8a95a5;--yellow:#fff3cd;--yellow-border:#ffc107;--shadow:0 2px 12px rgba(0,20,50,.06);--radius:10px}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:40}
.header-left{display:flex;align-items:center;gap:14px}
.header-left img{height:34px}
.header-left .sep{width:1px;height:26px;background:var(--border)}
.header-left h1{font-size:15px;font-weight:700;color:var(--navy)}.header-left h1 span{color:var(--accent);font-weight:800}
.header-left p{font-size:9px;color:var(--text-muted)}
.header-right{display:flex;gap:8px;align-items:center}
.container{max-width:1400px;margin:0 auto;padding:16px 20px}
.topbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-box{display:flex;align-items:center;gap:6px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:6px 12px;flex:1;min-width:200px;max-width:350px}
.search-box input{border:none;background:transparent;font-family:'Outfit',sans-serif;font-size:12px;outline:none;flex:1;color:var(--text)}
.filter-btn{padding:6px 12px;border:1px solid var(--border);border-radius:7px;background:#fff;font-family:'Outfit',sans-serif;font-size:11px;font-weight:500;cursor:pointer;color:var(--text-muted);transition:all .15s}
.filter-btn:hover,.filter-btn.active{border-color:var(--navy);color:var(--navy);background:var(--navy-soft)}
.stats{display:flex;gap:6px;margin-left:auto}
.stat{background:var(--bg-card);border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:10px;color:var(--text-muted);font-weight:600}
.stat b{color:var(--text);font-size:13px;margin-right:3px}
.btn{padding:7px 14px;border:none;border-radius:7px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:4px}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{opacity:.9}
.btn-a{background:var(--green);color:#fff}.btn-a:hover{opacity:.9}
.btn-w{background:var(--accent);color:#fff}.btn-w:hover{opacity:.9}
.btn-g{background:#fff;color:var(--text-muted);border:1px solid var(--border)}.btn-g:hover{background:var(--bg-input)}
.btn-d{background:transparent;color:var(--red);border:1px solid rgba(217,48,37,.2)}.btn-d:hover{background:var(--red-soft)}
.btn-sm{padding:4px 8px;font-size:10px}

/* TABLE */
.tbl-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:11px}
th{background:var(--navy);color:#fff;font-size:9px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;padding:8px 8px;text-align:left;position:sticky;top:0;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--border-light);vertical-align:top}
tr:hover td{background:var(--navy-soft)}
tr.changed td{background:var(--yellow)}
.mono{font-family:'JetBrains Mono',monospace;font-size:10px}
.tag{display:inline-block;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.tag-rail{background:var(--blue-soft);color:var(--blue)}
.tag-sea{background:var(--green-soft);color:var(--green)}
.tag-fcl{background:var(--accent-soft);color:#8a5e00}
.tag-air{background:var(--red-soft);color:var(--red)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-transit{background:#f59e0b}
.status-delivered{background:#10b981}
.status-customs{background:#ef4444}
.status-waiting{background:#8b5cf6}
.uwagi-cell{max-width:250px;font-size:10px;color:var(--text-muted);line-height:1.4}
.edit-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px;opacity:.5;transition:opacity .15s}.edit-btn:hover{opacity:1}
.hist-btn{background:none;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:9px;padding:2px 6px;color:var(--text-dim);font-family:'Outfit',sans-serif;transition:all .15s}.hist-btn:hover{color:var(--navy);border-color:var(--navy)}
.no-col{width:30px;color:var(--text-dim);font-weight:600}

/* MODAL */
.modal-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,20,50,.4);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:14px;padding:24px;width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal .form-row{display:grid;gap:8px;margin-bottom:8px}
.modal .form-row.two{grid-template-columns:1fr 1fr}
.modal .form-row.three{grid-template-columns:1fr 1fr 1fr}
.modal .form-row.four{grid-template-columns:1fr 1fr 1fr 1fr}
.modal label{display:block;font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:2px}
.modal input,.modal select,.modal textarea{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Outfit',sans-serif;font-size:11px;padding:7px 9px;outline:none;transition:border-color .15s}
.modal textarea{min-height:50px;resize:vertical;font-size:10px}
.modal input:focus,.modal select:focus,.modal textarea:focus{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
.modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}

/* HISTORY MODAL */
.hist-list{max-height:350px;overflow-y:auto}
.hist-item{padding:8px 10px;border-bottom:1px solid var(--border-light);font-size:10px}
.hist-item:last-child{border-bottom:none}
.hist-date{font-weight:600;color:var(--navy);font-size:9px;margin-bottom:3px}
.hist-change{color:var(--text-muted);line-height:1.5}
.hist-change .field{font-weight:600;color:var(--text)}
.hist-change .old{text-decoration:line-through;color:var(--red);background:var(--red-soft);padding:0 3px;border-radius:2px}
.hist-change .new{color:var(--green);background:var(--green-soft);padding:0 3px;border-radius:2px;font-weight:600}

.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#fff;padding:10px 18px;border-radius:8px;font-size:12px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.12);transform:translateY(80px);opacity:0;transition:all .3s;z-index:200}
.toast.show{transform:translateY(0);opacity:1}
tr.row-hidden td{opacity:.45}
@media print{.header,.topbar,.edit-btn,.hist-btn,.btn,.modal-bg{display:none!important}.tbl-wrap{box-shadow:none;border:none}th{background:#eee;color:#1a1a1a;-webkit-print-color-adjust:exact;print-color-adjust:exact}tr.changed td{background:#fff3cd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">

    <div class="form-row two">
      <div><label>Dostawca</label><input type="text" id="m_supplier"></div>

      <div><label>CBM</label><input type="number" step="0.001" id="m_cbm"></div>

      <div><label>PCS</label><input type="number" id="m_pcs"></div>

      <div><label>ETA</label><input type="date" id="m_eta"></div>

    </div>

    <h2>📋 Historia zmian</h2>
    <div class="hist-list" id="histList"></div>
    <div class="modal-actions"><button class="btn btn-g" onclick="closeHist()">Zamknij</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// =====================================================
// KONFIGURACJA — WKLEJ SWÓJ URL WEB APP PONIŻEJ:
// =====================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbzMcNsLR-mU1_cybiB59CTreOrnWPk7SF-x688WnIkwG_qS2dHk97lb0BNDx1hSwIUBJg/exec';
// =====================================================

const FIELDS=['supplier','mode','offer','order','bl','cbm','kg','pcs','etd','eta','notes','status'];
const LABELS={supplier:'Dostawca',mode:'Tryb',offer:'Nr oferty',order:'Zamówienie',bl:'BL NO',cbm:'CBM',kg:'KG',pcs:'PCS',etd:'ETD',eta:'ETA',notes:'Uwagi',status:'Status'};
let shipments=[];
let filter='all';
let nextId=1;

async function api(params){
  if(!API_URL||API_URL==='WKLEJ_TUTAJ_URL_WEB_APP')return{error:'no_api'};
  try{
    // GET for load, POST for save (data too large for URL params)
    if(params.action==='save'){
      const r=await fetch(API_URL,{
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body:'action=save&data='+encodeURIComponent(JSON.stringify(params.data))
      });
      return await r.json();
    }else{
      const url=new URL(API_URL);
      Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,typeof v==='object'?JSON.stringify(v):v));
      const r=await fetch(url.toString());
      return await r.json();
    }
  }catch(e){console.error('API:',e);return{error:e.message}}
}

function syncStatus(msg){
  let el=document.getElementById('syncInfo');
  if(el)el.textContent=msg;
}

let sheetsLoaded=false;

function loadData(){
  // Show loading state immediately
  document.getElementById('tBody').innerHTML='<tr><td colspan="13" style="text-align:center;padding:30px;color:var(--text-dim)">⏳ Ładuję dane z Google Sheets...</td></tr>';
  // Try Sheets first — it's the source of truth
  loadFromSheets();
}

async function loadFromSheets(){
  if(!API_URL||API_URL==='WKLEJ_TUTAJ_URL_WEB_APP'){
    // No API — fall back to localStorage / defaults
    loadLocal();
    sheetsLoaded=true;
    return;
  }
  syncStatus('⏳ Ładuję...');
  try{
    const res=await api({action:'load'});
    if(res.success&&res.data&&res.data.length){
      shipments=res.data;
      nextId=Math.max(...shipments.map(s=>s.id),0)+1;
      try{localStorage.setItem('klient2_shipments',JSON.stringify(shipments))}catch(e){}
      sheetsLoaded=true;
      renderTable();
      syncStatus('🔗 Google Sheets');
      return;
    }
  }catch(e){console.error('Load error:',e)}
  // Sheets failed or empty — fall back to localStorage
  loadLocal();
  sheetsLoaded=true;
  syncStatus('⚠️ Dane lokalne (Sheets niedostępne)');
}

function loadLocal(){
  try{const d=localStorage.getItem('klient2_shipments');if(d){shipments=JSON.parse(d);nextId=Math.max(...shipments.map(s=>s.id),0)+1}}catch(e){}
  if(!shipments.length)importDefaults();
  renderTable();
}

async function saveToSheets(){
  if(!API_URL||API_URL==='WKLEJ_TUTAJ_URL_WEB_APP'){syncStatus('💾 Lokalnie');return}
  syncStatus('⏳ Zapisuję...');
  try{
    const res=await api({action:'save',data:shipments});
    if(res.success){syncStatus('✅ Zapisano');setTimeout(()=>syncStatus('🔗 Google Sheets'),2000)}
    else{syncStatus('💾 Lokalnie')}
  }catch(e){syncStatus('💾 Lokalnie')}
}

function saveData(){
  localStorage.setItem('klient2_shipments',JSON.stringify(shipments));
  saveToSheets();
}

function fD(d){if(!d)return '';try{const dt=new Date(d);if(isNaN(dt))return d;return dt.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric'})}catch(e){return d}}
function tagClass(m){const l=m.toLowerCase();if(l==='rail')return 'tag-rail';if(l==='sea')return 'tag-sea';if(l==='fcl')return 'tag-fcl';if(l==='air')return 'tag-air';return 'tag-rail'}

function renderTable(){
  const q=document.getElementById('search').value.toLowerCase();
  const tb=document.getElementById('tBody');
  const hiddenCount=shipments.filter(s=>s.hidden).length;
  const hEl=document.getElementById('stHidden');
  if(hEl)hEl.textContent=hiddenCount?'('+hiddenCount+')':'';
  let list=shipments.filter(s=>{
    if(filter==='hidden')return s.hidden;
    if(s.hidden)return false;
    if(filter==='rail')return s.mode.toLowerCase()==='rail';
    if(filter==='sea')return['sea','fcl'].includes(s.mode.toLowerCase());
    if(filter==='air')return s.mode.toLowerCase()==='air';
    if(filter==='active')return s.status!=='delivered';
    return true;
  });
  if(q)list=list.filter(s=>FIELDS.some(f=>(s[f]||'').toString().toLowerCase().includes(q)));

  document.getElementById('stTotal').textContent=shipments.length;
  document.getElementById('stActive').textContent=shipments.filter(s=>s.status!=='delivered').length;

  if(!list.length){tb.innerHTML='<tr><td colspan="13" style="text-align:center;padding:30px;color:var(--text-dim)">Brak przesyłek</td></tr>';return}

  tb.innerHTML=list.map((s,i)=>{
    const hasRecent=s.history&&s.history.length&&isRecent(s.history[s.history.length-1].date);
    return `<tr class="${hasRecent?'changed':''} ${s.hidden?'row-hidden':''}">
      <td class="no-col">${i+1}</td>
      <td style="font-weight:600">${esc(s.supplier)}</td>
      <td><span class="tag ${tagClass(s.mode)}">${esc(s.mode)}</span></td>
      <td class="mono">${esc(s.offer||'')}</td>
      <td class="mono">${esc(s.order||'')}</td>
      <td class="mono">${esc(s.bl)}</td>
      <td class="mono">${s.cbm||''}</td>
      <td class="mono">${s.kg||''}</td>
      <td class="mono">${s.pcs||''}</td>
      <td class="mono">${fD(s.etd)}</td>
      <td class="mono">${fD(s.eta)}</td>
      <td class="uwagi-cell">${esc(s.notes||'')}</td>
      <td>
        <button class="edit-btn" onclick="openEdit(${s.id})" title="Edytuj">✏️</button>
        <button class="edit-btn" onclick="toggleHide(${s.id})" title="${s.hidden?'Pokaż':'Ukryj'}">${s.hidden?'👁️':'🙈'}</button>
        <button class="hist-btn" onclick="openHist(${s.id})" title="Historia">${(s.history||[]).length}</button>
      </td>
    </tr>`}).join('');
}

function isRecent(dateStr){if(!dateStr)return false;const d=new Date(dateStr);const now=new Date();return(now-d)<7*24*60*60*1000}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function setFilter(f,el){
  filter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

// === MODAL ===
function openAdd(){
  if(!sheetsLoaded){toast('⏳ Poczekaj — ładuję dane z Sheets...');return}
  document.getElementById('modalTitle').textContent='📦 Nowa przesyłka';
  document.getElementById('m_id').value='';
  FIELDS.forEach(f=>document.getElementById('m_'+f).value='');
  document.getElementById('m_mode').value='RAIL';
  document.getElementById('m_status').value='active';
  document.getElementById('delBtn').style.display='none';
  document.getElementById('modalBg').classList.add('open');
}

function openEdit(id){
  if(!sheetsLoaded){toast('⏳ Poczekaj — ładuję dane z Sheets...');return}
  const s=shipments.find(x=>x.id===id);if(!s)return;
  document.getElementById('modalTitle').textContent='✏️ Edytuj przesyłkę #'+id;
  document.getElementById('m_id').value=id;
  FIELDS.forEach(f=>document.getElementById('m_'+f).value=s[f]||'');
  document.getElementById('delBtn').style.display='inline-flex';
  document.getElementById('modalBg').classList.add('open');
}

function closeModal(){document.getElementById('modalBg').classList.remove('open')}

function saveShipment(){
  const idVal=document.getElementById('m_id').value;
  const data={};
  FIELDS.forEach(f=>{
    let val=document.getElementById('m_'+f).value.trim();
    if(['cbm','kg','pcs'].includes(f)&&val)val=parseFloat(val)||val;
    data[f]=val;
  });

  if(!data.supplier){toast('Wpisz dostawcę!');return}

  if(idVal){
    // EDIT - track changes
    const id=parseInt(idVal);
    const s=shipments.find(x=>x.id===id);if(!s)return;
    const changes=[];
    FIELDS.forEach(f=>{
      const oldVal=String(s[f]||'');
      const newVal=String(data[f]||'');
      if(oldVal!==newVal)changes.push({field:f,old:oldVal,new:newVal});
    });
    if(changes.length){
      if(!s.history)s.history=[];
      s.history.push({date:new Date().toISOString(),changes});
    }
    FIELDS.forEach(f=>s[f]=data[f]);
    toast('Przesyłka zaktualizowana');
  }else{
    // NEW
    data.id=nextId++;
    data.history=[{date:new Date().toISOString(),changes:[{field:'_created',old:'',new:'Utworzono przesyłkę'}]}];
    shipments.push(data);
    toast('Przesyłka dodana');
  }

  saveData();renderTable();closeModal();
}

function deleteShipment(){
  const id=parseInt(document.getElementById('m_id').value);
  if(!confirm('Usunąć tę przesyłkę?'))return;
  shipments=shipments.filter(x=>x.id!==id);
  saveData();renderTable();closeModal();toast('Usunięto');
}

// === HISTORY ===
function openHist(id){
  const s=shipments.find(x=>x.id===id);if(!s)return;
  const list=document.getElementById('histList');
  const hist=(s.history||[]).slice().reverse();
  if(!hist.length){list.innerHTML='<div style="padding:20px;text-align:center;color:var(--text-dim)">Brak historii zmian</div>';
  }else{
    list.innerHTML=hist.map(h=>{
      const d=new Date(h.date);
      const dateStr=d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const changesHtml=h.changes.map(c=>{
        if(c.field==='_created')return '<div class="hist-change">'+esc(c.new)+'</div>';
        return '<div class="hist-change"><span class="field">'+(LABELS[c.field]||c.field)+':</span> <span class="old">'+esc(c.old||'(puste)')+'</span> → <span class="new">'+esc(c.new||'(puste)')+'</span></div>';
      }).join('');
      return '<div class="hist-item"><div class="hist-date">'+dateStr+'</div>'+changesHtml+'</div>';
    }).join('');
  }
  document.getElementById('histBg').classList.add('open');
}
function closeHist(){document.getElementById('histBg').classList.remove('open')}

// === EXPORT ===
function exportXLS(){
  let csv='\uFEFF"No.";"Dostawca";"Tryb";"Nr oferty";"Zamówienie";"BL NO";"CBM";"KG";"PCS";"ETD";"ETA";"Uwagi";"Status"\n';
  const visible=shipments.filter(s=>!s.hidden);
  visible.forEach((s,i)=>{
    csv+=`"${i+1}";"${s.supplier}";"${s.mode}";"${s.offer||''}";"${s.order||''}";"${s.bl||''}";"${s.cbm||''}";"${s.kg||''}";"${s.pcs||''}";"${fD(s.etd)}";"${fD(s.eta)}";"${(s.notes||'').replace(/"/g,'""')}";"${s.status||''}"\n`;
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='AWEX_zestawienie_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click();toast('Wyeksportowano CSV');
}

// === IMPORT DEFAULTS from the Excel data ===
function importDefaults(){
  const raw=INITIAL_DATA;
  raw.forEach((r,i)=>{
    shipments.push({id:nextId++,supplier:r[0],mode:r[1],offer:'',order:r[2],bl:r[3],cbm:r[4],kg:r[5],pcs:r[6],etd:r[7],eta:r[8],notes:r[9],status:r[10]||'active',history:[{date:'2026-02-16T10:00:00.000Z',changes:[{field:'_created',old:'',new:'Import z Excel'}]}]});
  });
  saveData();
}

const INITIAL_DATA=[];

function toggleHide(id){
  if(!sheetsLoaded){toast('⏳ Poczekaj — ładuję dane z Sheets...');return}
  const s=shipments.find(x=>x.id===id);if(!s)return;
  s.hidden=!s.hidden;
  saveData();renderTable();
  toast(s.hidden?'Przesyłka ukryta':'Przesyłka przywrócona');
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

loadData();
renderTable();
</script>
</body>
</html>
